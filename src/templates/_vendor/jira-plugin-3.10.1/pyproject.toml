[project]
name = "complikey-jira-plugin-overlay"
version = "0.0.0"
description = "Sandcastle's vendored overlay for netresearch/jira-skill v3.10.1, plus jira-pickup."
requires-python = ">=3.10"

[dependency-groups]
dev = [
    "click>=8.3.3",
    "pytest>=8.0,<9",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["skills/jira-communication/scripts/core"]
